name: análisis estático

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  # CodeQL falla si se le pide analizar un lenguaje del que no hay una sola
  # línea. Hasta que los módulos tengan código, la matriz se arma con los
  # lenguajes presentes de verdad en el repositorio.
  detectar:
    runs-on: ubuntu-latest
    outputs:
      lenguajes: ${{ steps.d.outputs.lenguajes }}
      hay: ${{ steps.d.outputs.hay }}
    steps:
      - uses: actions/checkout@v7

      - id: d
        run: |
          LENG=()
          if find core motor paciente contrato -type f \( -name '*.kt' -o -name '*.java' \) -print -quit 2>/dev/null | grep -q .; then
            LENG+=('"java-kotlin"')
          fi
          if find farmacia contrato -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.js' \) -print -quit 2>/dev/null | grep -q .; then
            LENG+=('"javascript-typescript"')
          fi
          if [ ${#LENG[@]} -eq 0 ]; then
            echo "hay=no" >> $GITHUB_OUTPUT
            echo "lenguajes=[]" >> $GITHUB_OUTPUT
            echo "Todavía no hay código fuente que analizar."
          else
            echo "hay=si" >> $GITHUB_OUTPUT
            printf 'lenguajes=[%s]\n' "$(IFS=,; echo "${LENG[*]}")" >> $GITHUB_OUTPUT
          fi

  analizar:
    needs: detectar
    if: needs.detectar.outputs.hay == 'si'
    runs-on: ubuntu-latest
    # En repositorios privados CodeQL necesita leer la ejecucion del flujo
    # para subir resultados; sin actions: read falla despues de analizar.
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        lenguaje: ${{ fromJSON(needs.detectar.outputs.lenguajes) }}

    steps:
      - uses: actions/checkout@v7

      # Kotlin se analiza observando la compilacion, asi que hay que compilar.
      # TypeScript se analiza leyendo el codigo, sin construir nada.
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.lenguaje }}
          queries: security-extended
          build-mode: ${{ matrix.lenguaje == 'java-kotlin' && 'manual' || 'none' }}

      - uses: actions/setup-java@v6
        if: matrix.lenguaje == 'java-kotlin'
        with:
          distribution: temurin
          java-version: "21"

      # El autobuild de CodeQL no sabe elegir cuando hay mas de un proyecto
      # Gradle ("Cannot auto-detect a single build directory"). Se compila cada
      # modulo que exista, sin cache, para que CodeQL vea toda la compilacion.
      - name: Compilar los módulos Kotlin
        if: matrix.lenguaje == 'java-kotlin'
        run: |
          for m in motor core paciente; do
            [ -f "$m/gradlew" ] || continue
            chmod +x "$m/gradlew"
            if grep -qs "com.android" "$m/build.gradle.kts" "$m/app/build.gradle.kts"; then
              tarea=assembleDebug
            else
              tarea=testClasses
            fi
            echo "::group::$m ($tarea)"
            (cd "$m" && ./gradlew --no-daemon --no-build-cache -Pkotlin.compiler.execution.strategy=in-process clean $tarea)
            echo "::endgroup::"
          done

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/lenguaje:${{ matrix.lenguaje }}"
