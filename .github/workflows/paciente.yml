name: paciente

on:
  push:
    branches: [main]
    paths: ["paciente/**", "contrato/**", ".github/workflows/paciente.yml"]
  # En los pull requests corre siempre, aunque el cambio no toque este modulo:
  # es un check obligatorio de main, y un check obligatorio que no se ejecuta
  # deja el pull request bloqueado. Sin cambios en el modulo termina en segundos.
  pull_request:

jobs:
  paciente:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: paciente

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que el módulo ya tiene código
        id: existe
        run: |
          if [ -f gradlew ]; then
            # Quien commitea desde Windows no registra el permiso de ejecucion.
            chmod +x gradlew
            echo "listo=si" >> $GITHUB_OUTPUT
          else
            echo "listo=no" >> $GITHUB_OUTPUT
            echo "Módulo aún sin código; nada que compilar."
          fi

      - uses: actions/setup-java@v6
        if: steps.existe.outputs.listo == 'si'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Pruebas unitarias
        if: steps.existe.outputs.listo == 'si'
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Análisis de Android
        if: steps.existe.outputs.listo == 'si'
        run: ./gradlew lintDebug --no-daemon

      - name: Compilar APK de depuración
        if: steps.existe.outputs.listo == 'si'
        run: ./gradlew assembleDebug --no-daemon
