name: core

on:
  push:
    branches: [main]
    paths: ["core/**", "motor/**", "contrato/**", ".github/workflows/core.yml"]
  # En los pull requests corre siempre, aunque el cambio no toque este modulo:
  # es un check obligatorio de main, y un check obligatorio que no se ejecuta
  # deja el pull request bloqueado. Sin cambios en el modulo termina en segundos.
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pruebas
          POSTGRES_DB: midosis_qa
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v7

      # La comprobación va antes de preparar el entorno: la caché de Gradle
      # falla si el módulo todavía no tiene manifiestos que resumir.
      - name: Comprobar que el módulo ya tiene código
        id: existe
        run: |
          if [ -f gradlew ]; then
            # Quien commitea desde Windows no registra el permiso de ejecucion.
            chmod +x gradlew
            echo "listo=si" >> $GITHUB_OUTPUT
          else
            echo "listo=no" >> $GITHUB_OUTPUT
            echo "Módulo aún sin código; nada que compilar."
          fi

      - uses: actions/setup-java@v6
        if: steps.existe.outputs.listo == 'si'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compilar y probar
        if: steps.existe.outputs.listo == 'si'
        run: ./gradlew build --no-daemon
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/midosis_qa
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: pruebas

      # Condicion de la Definicion de Terminado que protege el ADR-011. Mientras
      # core no acceda a datos no hay nada que aislar; en cuanto aparece codigo de
      # persistencia, la bateria de aislamiento pasa a ser obligatoria y su
      # ausencia hace fallar la verificacion.
      - name: Aislamiento entre comunas
        if: steps.existe.outputs.listo == 'si'
        run: |
          PERSISTENCIA=$(grep -rlE '@Entity|@Table|JpaRepository|CrudRepository|JdbcTemplate|JdbcClient|DataSource' src/main 2>/dev/null | head -1 || true)
          PRUEBAS=$(find src/test -name '*Aislamiento*' 2>/dev/null | head -1)
          if [ -n "$PRUEBAS" ]; then
            ./gradlew test --tests "*Aislamiento*" --no-daemon
          elif [ -n "$PERSISTENCIA" ]; then
            echo "::error::core accede a datos ($PERSISTENCIA) pero no tiene pruebas de aislamiento entre comunas (HU-28)."
            exit 1
          else
            echo "::warning::core aun no accede a datos; la bateria de aislamiento sera obligatoria en cuanto lo haga (HU-28)."
          fi

      - name: Publicar cobertura
        if: steps.existe.outputs.listo == 'si'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-core
          path: core/build/reports/jacoco/
          if-no-files-found: ignore
