name: farmacia

on:
  push:
    branches: [main]
    paths: ["farmacia/**", "contrato/**", ".github/workflows/farmacia.yml"]
  # En los pull requests corre siempre, aunque el cambio no toque este modulo:
  # es un check obligatorio de main, y un check obligatorio que no se ejecuta
  # deja el pull request bloqueado. Sin cambios en el modulo termina en segundos.
  pull_request:

jobs:
  farmacia:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farmacia

    steps:
      - uses: actions/checkout@v7

      # Igual que en los módulos de Gradle: la caché de npm falla si todavía
      # no existe el archivo de bloqueo que resume.
      - name: Comprobar que el módulo ya tiene código
        id: existe
        run: |
          if [ -f package.json ]; then
            echo "listo=si" >> $GITHUB_OUTPUT
          else
            echo "listo=no" >> $GITHUB_OUTPUT
            echo "Módulo aún sin código; nada que compilar."
          fi

      - uses: actions/setup-node@v7
        if: steps.existe.outputs.listo == 'si'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: farmacia/package-lock.json

      - name: Instalar dependencias
        if: steps.existe.outputs.listo == 'si'
        run: npm ci

      - name: Estilo y tipos
        if: steps.existe.outputs.listo == 'si'
        run: npm run lint

      - name: Pruebas
        if: steps.existe.outputs.listo == 'si'
        run: npm test

      - name: Construir
        if: steps.existe.outputs.listo == 'si'
        run: npm run build
