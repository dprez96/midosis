name: motor

on:
  push:
    branches: [main]
    paths: ["motor/**", ".github/workflows/motor.yml"]
  # En los pull requests corre siempre, aunque el cambio no toque este modulo:
  # es un check obligatorio de main, y un check obligatorio que no se ejecuta
  # deja el pull request bloqueado. Sin cambios en el modulo termina en segundos.
  pull_request:

jobs:
  motor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: motor

    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que el módulo ya tiene código
        id: existe
        run: |
          if [ -f gradlew ]; then
            # Quien commitea desde Windows no registra el permiso de ejecucion.
            chmod +x gradlew
            echo "listo=si" >> $GITHUB_OUTPUT
          else
            echo "listo=no" >> $GITHUB_OUTPUT
            echo "Módulo aún sin código; nada que compilar."
          fi

      - uses: actions/setup-java@v6
        if: steps.existe.outputs.listo == 'si'
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Compilar y probar
        if: steps.existe.outputs.listo == 'si'
        run: ./gradlew build --no-daemon

      - name: Publicar cobertura
        if: steps.existe.outputs.listo == 'si'
        uses: actions/upload-artifact@v7
        with:
          name: cobertura-motor
          path: motor/build/reports/jacoco/
          if-no-files-found: ignore
