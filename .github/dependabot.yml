version: 2

# Cada ecosistema se activa cuando su modulo tiene manifiesto: Dependabot falla
# si apunta a una carpeta sin build.gradle.kts o sin package.json.
# Pendiente: /farmacia (npm), cuando exista su package.json.
updates:
  - package-ecosystem: gradle
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /motor
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /paciente
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
