version: 2

# Hasta la entrega final (11-12-2026) solo se abren pull requests de seguridad: el límite 0
# detiene las actualizaciones de versión, pero no las alertas ni las actualizaciones de
# seguridad de Dependabot. Después de la entrega se restauran los límites anteriores
# (5 en gradle, npm de farmacia y github-actions; 2 en pip y npm de infra/firebase).
#
# Cada ecosistema se activa cuando su modulo tiene manifiesto: Dependabot falla
# si apunta a una carpeta sin build.gradle.kts o sin package.json.
updates:
  - package-ecosystem: gradle
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /motor
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /contrato/kotlin
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: pip
    directory: /contrato/herramientas
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: gradle
    directory: /paciente
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /farmacia
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      # Las dos piezas de Firebase tienen que quedar en la misma entrega.
      firebase:
        patterns: ["@firebase/*"]
      # Las herramientas de desarrollo se prueban juntas, en un solo pull request.
      herramientas:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # jsdom 30 exige Node 22.22 o posterior.
      - dependency-name: jsdom
        versions: [">=30"]
      # typescript-eslint todavía no soporta TypeScript 6.1 ni la 7.
      - dependency-name: typescript
        versions: [">=6.1"]
      # Los tipos de Node deben coincidir con el Node que usamos, el 22: con los de una
      # versión posterior, el editor aceptaría funciones que Node 22 no tiene.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: npm
    directory: /infra/firebase
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
